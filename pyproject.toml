[project]
name = "spanskikh-profile"
version = "0.7.0"
description = "Root GitHub Profile Showcase for the spanskikh Neuro-Symbolic Verification Cluster"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "mypy>=1.11.0", "ruff>=0.6.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
python_version = "3.12"
